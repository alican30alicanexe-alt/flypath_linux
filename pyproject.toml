[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrajectory"
version = "0.1.3"
description = "A Python clone of MATLAB's flypath3d for precision 3D trajectory visualization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["3d", "trajectory", "visualization", "matlab", "pyvista"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyvista>=0.48.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "imageio>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/alican30alicanexe-alt/flypath_linux"

[project.scripts]
pytrajectory = "pytrajectory.cli:main"

[tool.setuptools.packages.find]
include = ["pytrajectory*"]